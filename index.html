<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NØRMAL</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Orb canvas ── */
    .orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      animation: float linear infinite;
    }

    /* EXPERIMENT: floating orbs use the NØRMAL logo image */
    .orb::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: url('/orb-logo.png') center / contain no-repeat;
      filter: drop-shadow(0 8px 40px rgba(0,0,0,0.6));
    }

    /* Ø emboss disabled — the logo image already contains the mark */
    .orb::after {
      content: none;
    }

    /* Individual orb sizes / positions / speeds */
    .orb-1 {
      width: 340px; height: 340px;
      top: -60px; left: -80px;
      animation-duration: 18s;
      animation-delay: 0s;
    }
    .orb-1::after { font-size: 160px; }

    .orb-2 {
      width: 220px; height: 220px;
      top: 55%; right: -50px;
      animation-duration: 24s;
      animation-delay: -6s;
    }
    .orb-2::after { font-size: 100px; }

    .orb-3 {
      width: 160px; height: 160px;
      bottom: -30px; left: 30%;
      animation-duration: 20s;
      animation-delay: -10s;
    }
    .orb-3::after { font-size: 74px; }

    .orb-4 {
      width: 120px; height: 120px;
      top: 20%; right: 18%;
      animation-duration: 28s;
      animation-delay: -4s;
    }
    .orb-4::after { font-size: 54px; }

    .orb-5 {
      width: 80px; height: 80px;
      top: 65%; left: 12%;
      animation-duration: 22s;
      animation-delay: -14s;
    }
    .orb-5::after { font-size: 36px; }

    /* Mobile orb scaling */
    @media (max-width: 480px) {
      .orb-1 { width: 200px; height: 200px; top: -40px; left: -50px; }
      .orb-1::after { font-size: 90px; }
      .orb-2 { width: 140px; height: 140px; top: 58%; right: -30px; }
      .orb-2::after { font-size: 64px; }
      .orb-3 { width: 110px; height: 110px; bottom: -20px; left: 28%; }
      .orb-3::after { font-size: 50px; }
      .orb-4 { width: 80px; height: 80px; top: 18%; right: 12%; }
      .orb-4::after { font-size: 36px; }
      .orb-5 { width: 55px; height: 55px; top: 68%; left: 8%; }
      .orb-5::after { font-size: 24px; }
    }

    @keyframes float {
      0%   { transform: translateY(0px) rotate(0deg); }
      25%  { transform: translateY(-18px) rotate(4deg); }
      50%  { transform: translateY(-8px) rotate(-2deg); }
      75%  { transform: translateY(-24px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    /* ── Center logo ── */
    .center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
      user-select: none;
    }

    .logo {
      font-family: 'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk', 'NeueHaasGroteskDisplayPro', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(56px, 16vw, 180px);
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
      padding: 0 16px;
    }

    .tagline {
      font-family: 'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(11px, 2vw, 15px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    .ig-link {
      font-family: 'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: clamp(10px, 2vw, 13px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      transition: color 0.3s ease;
      margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .ig-link:hover, .ig-link:active {
      color: rgba(255,255,255,0.65);
    }

    /* Vignette overlay to deepen the edges */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.85) 100%);
    }

    /* ── Technical / mil-spec layer ── */
    :root { --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; }

    /* Small tracked monospace labels pinned to each corner */
    .tech-label {
      position: fixed;
      z-index: 11;
      font-family: var(--mono);
      font-size: clamp(8.5px, 1.3vw, 10.5px);
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1.7;
      color: rgba(255,255,255,0.42);
      pointer-events: none;
    }
    .tech-label .dim { color: rgba(255,255,255,0.22); }
    .tech-tl { top: 26px; left: 30px; }
    .tech-tr { top: 26px; right: 30px; text-align: right; }
    .tech-bl { bottom: 26px; left: 30px; }
    .tech-br { bottom: 26px; right: 30px; text-align: right; }

    /* HUD registration brackets — L-shaped corner marks */
    .bracket {
      position: fixed;
      width: 16px; height: 16px;
      border: 1px solid rgba(255,255,255,0.28);
      z-index: 11;
      pointer-events: none;
    }
    .bracket.tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
    .bracket.tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
    .bracket.bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
    .bracket.br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }

    /* Center monospace spec strip — the Anduril caption row */
    .spec {
      display: flex;
      align-items: center;
      gap: 13px;
      font-family: var(--mono);
      font-size: clamp(10px, 1.7vw, 13px);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    .spec .sep { color: rgba(255,255,255,0.18); font-weight: 400; }
    .spec .spec-link {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .spec .spec-link:hover, .spec .spec-link:active { color: #fff; }

    /* Tighten the wordmark a touch — more monumental/industrial */
    .logo {
      letter-spacing: -0.04em;
      animation: logo-jitter-a 13.1s linear infinite;
      will-change: transform, filter;
    }
    /* Second, coprime layer — composes with the outer transform so the
       combined jitter pattern doesn't visibly repeat for ~2 min */
    .logo-inner {
      display: inline-block;
      animation: logo-jitter-b 9.7s linear infinite;
      will-change: transform, filter;
    }

    /* Bursts sit at uneven points in each loop → irregular intervals.
       Amplitude is sub-pixel-ish + a faint blur = barely-there disruption. */
    @keyframes logo-jitter-a {
      0%, 8.6%  { transform: translate(0, 0);          filter: blur(0); }
      9.0%      { transform: translate(1px, -0.6px);   filter: blur(0.5px); }
      9.4%      { transform: translate(-1.2px, 0.4px); filter: blur(0.3px); }
      9.8%      { transform: translate(0.8px, 0.6px);  filter: blur(0.6px); }
      10.2%     { transform: translate(-0.6px,-0.4px); filter: blur(0.2px); }
      10.6%, 51.5% { transform: translate(0, 0);       filter: blur(0); }
      51.9%     { transform: translate(-1px, 0.5px);   filter: blur(0.5px); }
      52.3%     { transform: translate(1.1px, -0.5px); filter: blur(0.4px); }
      52.7%     { transform: translate(-0.7px, 0.3px); filter: blur(0.6px); }
      53.1%     { transform: translate(0.5px, 0.4px);  filter: blur(0.2px); }
      53.5%, 79.8% { transform: translate(0, 0);       filter: blur(0); }
      80.2%     { transform: translate(1.2px, 0.5px);  filter: blur(0.6px); }
      80.6%     { transform: translate(-0.9px,-0.6px); filter: blur(0.4px); }
      81.0%     { transform: translate(0.6px, 0.7px);  filter: blur(0.5px); }
      81.4%     { transform: translate(-0.4px,-0.3px); filter: blur(0.2px); }
      81.8%, 100% { transform: translate(0, 0);        filter: blur(0); }
    }
    @keyframes logo-jitter-b {
      0%, 21.6% { transform: translate(0, 0);          filter: blur(0); }
      22.0%     { transform: translate(-0.8px, 0.4px); filter: blur(0.4px); }
      22.4%     { transform: translate(0.7px, -0.5px); filter: blur(0.3px); }
      22.8%     { transform: translate(-0.5px, 0.3px); filter: blur(0.4px); }
      23.2%     { transform: translate(0.4px, 0.2px);  filter: blur(0.15px); }
      23.6%, 65.5% { transform: translate(0, 0);       filter: blur(0); }
      65.9%     { transform: translate(0.8px, 0.5px);  filter: blur(0.4px); }
      66.3%     { transform: translate(-0.6px,-0.4px); filter: blur(0.3px); }
      66.7%     { transform: translate(0.5px, 0.3px);  filter: blur(0.4px); }
      67.1%     { transform: translate(-0.3px,-0.2px); filter: blur(0.15px); }
      67.5%, 100% { transform: translate(0, 0);        filter: blur(0); }
    }

    /* Accessibility: no jitter for users who ask for reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .logo, .logo-inner { animation: none; }
    }

    @media (max-width: 480px) {
      .tech-bl, .tech-br { display: none; }   /* declutter on small screens */
      .spec { gap: 9px; }
    }
  </style>
</head>
<body>

  <!-- HUD registration brackets -->
  <span class="bracket tl"></span>
  <span class="bracket tr"></span>
  <span class="bracket bl"></span>
  <span class="bracket br"></span>

  <!-- Technical corner labels -->
  <div class="tech-label tech-tl">NØRMAL<br><span class="dim">// MARKET</span></div>
  <div class="tech-label tech-tr">INDEX 001<br><span class="dim">EST. 2026.06.09</span></div>
  <div class="tech-label tech-bl">REC. NØRMAL<br><span class="dim">ALL RIGHTS RESERVED</span></div>
  <div class="tech-label tech-br">STATUS<br><span class="dim">● ONLINE</span></div>

  <div class="orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
  </div>

  <div class="vignette"></div>

  <div class="center">
    <div class="logo"><span class="logo-inner">NØRMAL</span></div>
    <div class="spec">
      <span>Market</span>
      <span class="sep">/</span>
      <span>Est. 2026</span>
      <span class="sep">/</span>
      <a class="spec-link" href="https://www.instagram.com/hqnormal" target="_blank" rel="noopener">&#8599; @hqnormal</a>
    </div>
  </div>

</body>
</html>
